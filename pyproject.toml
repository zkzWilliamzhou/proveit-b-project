[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proveit"
version = "1.0.1"
description = "Check the claims a repository makes against its own source"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
keywords = ["audit", "readme", "supply-chain", "static-analysis", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
proveit = "proveit.cli:main"

[tool.setuptools]
packages = ["proveit"]
